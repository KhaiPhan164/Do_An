{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block description %}E-Shopper{% endblock %}"
    >

    <meta name="author" content="">

    <title>
        {% block title %}
            Home | E-Shopper
        {% endblock %}
    </title>

    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/font-awesome.min.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/prettyPhoto.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/price-range.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/animate.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/main.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/responsive.css' %}"
        rel="stylesheet"
    >

    <link
        rel="shortcut icon"
        href="{% static 'images/ico/favicon.ico' %}"
    >

    <link
        rel="apple-touch-icon-precomposed"
        sizes="144x144"
        href="{% static 'images/ico/apple-touch-icon-144-precomposed.png' %}"
    >

    <link
        rel="apple-touch-icon-precomposed"
        sizes="114x114"
        href="{% static 'images/ico/apple-touch-icon-114-precomposed.png' %}"
    >

    <link
        rel="apple-touch-icon-precomposed"
        sizes="72x72"
        href="{% static 'images/ico/apple-touch-icon-72-precomposed.png' %}"
    >

    <link
        rel="apple-touch-icon-precomposed"
        href="{% static 'images/ico/apple-touch-icon-57-precomposed.png' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>

    {% include 'header.html' %}

    {% block slide %}
    {% endblock %}

    {% block content %}
    {% endblock %}

    {% include 'footer.html' %}

    <script src="{% static 'js/jquery.js' %}"></script>

    <script src="{% static 'js/bootstrap.min.js' %}"></script>

    <script src="{% static 'js/jquery.scrollUp.min.js' %}"></script>

    <script src="{% static 'js/price-range.js' %}"></script>

    <script src="{% static 'js/jquery.prettyPhoto.js' %}"></script>

    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>
</html>
