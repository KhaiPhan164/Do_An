{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block description %}E-Shopper{% endblock %}"
    >

    <meta name="author" content="">


    <title>
        {% block title %}
            Home | E-Shopper
        {% endblock %}
    </title>


    <link
        href="{% static 'css/bootstrap.min.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/rate.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/font-awesome.min.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/prettyPhoto.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/price-range.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/animate.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/main.css' %}"
        rel="stylesheet"
    >

    <link
        href="{% static 'css/responsive.css' %}"
        rel="stylesheet"
    >


    <link
        rel="shortcut icon"
        href="{% static 'images/ico/favicon.ico' %}"
    >


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <form
        id="csrf-form"
        style="display:none;"
    >
        {% csrf_token %}
    </form>


    {% include 'header.html' %}


    {% block slide %}
    {% endblock %}


    {% block content %}
    {% endblock %}


    {% include 'footer.html' %}



    <script src="{% static 'js/jquery.js' %}"></script>

    <script src="{% static 'js/bootstrap.min.js' %}"></script>

    <script src="{% static 'js/jquery.scrollUp.min.js' %}"></script>

    <script src="{% static 'js/price-range.js' %}"></script>

    <script src="{% static 'js/jquery.prettyPhoto.js' %}"></script>

    <script src="{% static 'js/main.js' %}"></script>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
