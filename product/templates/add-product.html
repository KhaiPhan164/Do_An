{% extends 'base.html' %}

{% block title %}
Add Product
{% endblock %}


{% block content %}

<div class="row">

    <div class="col-sm-3">

        {% include 'menu-account.html' %}

    </div>


    <div class="col-sm-9">

        <div class="signup-form">

            <h2>
                Create product!
            </h2>


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}


            <form id="productAjax" method="POST" enctype="multipart/form-data">

                {% csrf_token %}


                <div class="form-group">

                    <input type="text" name="name" id="name" class="form-control" placeholder="Name" required>

                    <p id="error-name" class="text-danger"></p>

                </div>


                <div class="form-group">

                    <input
        type="number"
        name="price"
        id="price"
        class="form-control"
        placeholder="Price"
        step="0.01"
        min="0"
        required
    >

    <p
        id="error-price"
        class="text-danger"
    ></p>

                </div>


                <div class="form-group">

                     <select
        name="category"
        id="category"
        class="form-control"
        required
    >

        <option value="">
            Please choose category
        </option>

        {% for category in categories %}

        <option value="{{ category.id }}">
            {{ category.name }}
        </option>

        {% endfor %}

    </select>

    <p
        id="error-category"
        class="text-danger"
    ></p>

                </div>


                <div class="form-group">

                     <select
        name="brand"
        id="brand"
        class="form-control"
        required
    >

        <option value="">
            Please choose brand
        </option>

        {% for brand in brands %}

        <option value="{{ brand.id }}">
            {{ brand.name }}
        </option>

        {% endfor %}

    </select>

    <p
        id="error-brand"
        class="text-danger"
    ></p>

                </div>


                <div class="form-group">

                    <select name="status" id="status" class="form-control">

                        <option value="0">
                            New
                        </option>

                        <option value="1">
                            Sale
                        </option>

                    </select>

                </div>


                <div class="form-group" id="sale-box" style="display: none;">

                    <input type="number" name="sale" class="form-control" placeholder="Sale" min="0" step="0.01"
                        value="0">

                </div>


                <div class="form-group">

                    <input type="text" name="company" class="form-control" placeholder="Company profile"
                        value="{{ request.POST.company }}">

                </div>


                <div class="form-group">

                     <input
        type="file"
        name="images"
        id="images"
        class="form-control"
        accept="image/*"
        multiple
    >

    <small>
        Upload tối đa 3 hình,
        mỗi hình nhỏ hơn 2MB.
    </small>

    <p
        id="error-images"
        class="text-danger"
    ></p>

                </div>


                <div class="form-group">

                    <textarea name="detail" class="form-control" rows="6"
                        placeholder="Detail">{{ request.POST.detail }}</textarea>

                </div>


                <button type="submit" class="btn btn-default">
                    Add Product
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        const form =
            document.getElementById(
                'productAjax'
            );

        const status =
            document.getElementById(
                'status'
            );

        const saleBox =
            document.getElementById(
                'sale-box'
            );

        const images =
            document.getElementById(
                'images'
            );


        function checkSale() {

            if (
                status.value === '1'
            ) {

                saleBox.style.display =
                    'block';

            } else {

                saleBox.style.display =
                    'none';

                const saleInput =
                    saleBox.querySelector(
                        'input[name="sale"]'
                    );

                saleInput.value = 0;

            }

        }


        status.addEventListener(
            'change',
            checkSale
        );


        images.addEventListener(
            'change',
            function () {

                if (
                    this.files.length > 3
                ) {

                    alert(
                        'Chỉ được chọn tối đa 3 hình.'
                    );

                    this.value = '';

                    return;

                }


                for (
                    let i = 0;
                    i < this.files.length;
                    i++
                ) {

                    const file =
                        this.files[i];


                    if (
                        !file.type.startsWith(
                            'image/'
                        )
                    ) {

                        alert(
                            file.name +
                            ' không phải hình ảnh.'
                        );

                        this.value = '';

                        return;

                    }


                    if (
                        file.size >
                        2 * 1024 * 1024
                    ) {

                        alert(
                            file.name +
                            ' lớn hơn 2MB.'
                        );

                        this.value = '';

                        return;

                    }

                }

            }
        );


        form.addEventListener(
            'submit',
            function (event) {

                event.preventDefault();


                document
                    .querySelectorAll(
                        '[id^="error-"]'
                    )
                    .forEach(
                        function (item) {

                            item.textContent = '';

                        }
                    );


                const formData =
                    new FormData(
                        form
                    );


                const submitButton =
                    form.querySelector(
                        'button[type="submit"]'
                    );


                submitButton.disabled =
                    true;


                fetch(
                    "{% url 'product:add_product_ajax' %}",
                    {

                        method: 'POST',

                        body: formData,

                        credentials:
                            'same-origin'

                    }
                )

                .then(
                    async function (
                        response
                    ) {

                        const data =
                            await response.json();


                        if (
                            !response.ok
                        ) {

                            throw data;

                        }


                        return data;

                    }
                )

                .then(
                    function (data) {

                        if (
                            data.status ===
                            'success'
                        ) {

                            window.location.href =
                                "{% url 'product:my_product' %}";

                        }

                    }
                )

                .catch(
                    function (data) {

                        if (
                            data.errors
                        ) {

                            Object
                                .keys(
                                    data.errors
                                )
                                .forEach(
                                    function (
                                        field
                                    ) {

                                        const errorElement =
                                            document.getElementById(
                                                'error-' +
                                                field
                                            );


                                        if (
                                            errorElement
                                        ) {

                                            errorElement.textContent =
                                                data.errors[
                                                    field
                                                ];

                                        } else {

                                            alert(
                                                data.errors[
                                                    field
                                                ]
                                            );

                                        }

                                    }
                                );

                        } else {

                            alert(
                                'Có lỗi xảy ra.'
                            );

                        }

                    }
                )

                .finally(
                    function () {

                        submitButton.disabled =
                            false;

                    }
                );

            }
        );


        checkSale();

    }
);

</script>

{% endblock %}
