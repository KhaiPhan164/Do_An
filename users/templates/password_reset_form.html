{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container">

    <div class="row">

        <div class="col-sm-4 col-sm-offset-4">

            <div class="login-form">

                <h2>
                    Forgot Password
                </h2>

                <p>
                    Nhập email của tài khoản để nhận link đặt lại mật khẩu.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <input
                        type="email"
                        name="email"
                        placeholder="Email"
                        required
                    >

                    {% if form.email.errors %}

                        <div class="alert alert-danger">

                            {{ form.email.errors }}

                        </div>

                    {% endif %}

                    <button
                        type="submit"
                        class="btn btn-default"
                    >
                        Send Reset Link
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
