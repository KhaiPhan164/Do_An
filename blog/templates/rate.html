{% load static %}

<link type="text/css" rel="stylesheet" href="{% static 'css/rate.css' %}">


<div class="rate" id="blog-rate" data-rate-url="{% url 'blog:rate_blog' blog.id %}"
    data-authenticated="{{ request.user.is_authenticated|yesno:'true,false' }}">

    <h4>
        Rate this blog
    </h4>


    <div class="vote">

        {% for i in "12345" %}
        <div class="star_{{ i }} ratings_stars {% if user_rate >= i|add:'0' %}ratings_over{% endif %}"
            data-rate="{{ i }}"></div>
        {% endfor %}

        <span class="rate-np" id="average-rate">
            {{ average_rate|default:"0" }}
        </span>

    </div>

</div>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const rateBox =
                document.getElementById(
                    "blog-rate"
                );

            if (!rateBox) {
                return;
            }


            const stars =
                rateBox.querySelectorAll(
                    ".ratings_stars"
                );


            const averageRate =
                document.getElementById(
                    "average-rate"
                );


            const rateUrl =
                rateBox.dataset.rateUrl;


            const isAuthenticated =
                rateBox.dataset.authenticated ===
                "true";


            stars.forEach(
                function (star) {


                    star.addEventListener(
                        "mouseenter",
                        function () {

                            const rate =
                                parseInt(
                                    this.dataset.rate
                                );


                            stars.forEach(
                                function (item) {

                                    const itemRate =
                                        parseInt(
                                            item.dataset.rate
                                        );


                                    if (
                                        itemRate <= rate
                                    ) {

                                        item.classList.add(
                                            "ratings_hover"
                                        );

                                    } else {

                                        item.classList.remove(
                                            "ratings_hover"
                                        );

                                    }

                                }
                            );

                        }
                    );


                    star.addEventListener(
                        "mouseleave",
                        function () {

                            stars.forEach(
                                function (item) {

                                    item.classList.remove(
                                        "ratings_hover"
                                    );

                                }
                            );

                        }
                    );


                    star.addEventListener(
                        "click",
                        function () {

                            if (
                                !isAuthenticated
                            ) {

                                alert(
                                    "Please login to rate this blog."
                                );

                                return;

                            }


                            const rate =
                                parseInt(
                                    this.dataset.rate
                                );


                            fetch(
                                rateUrl,
                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/x-www-form-urlencoded",

                                        "X-CSRFToken":
                                            "{{ csrf_token }}"

                                    },

                                    body:
                                        new URLSearchParams({

                                            "rate": rate

                                        })

                                }
                            )


                                .then(
                                    function (response) {

                                        return response.json();

                                    }
                                )


                                .then(
                                    function (data) {

                                        if (
                                            !data.success
                                        ) {

                                            alert(
                                                data.error
                                            );

                                            return;

                                        }


                                        const average =
                                            parseFloat(
                                                data.average_rate
                                            );


                                        averageRate.textContent =
                                            average.toFixed(1);


                                        stars.forEach(
                                            function (item) {

                                                const itemRate =
                                                    parseInt(
                                                        item.dataset.rate
                                                    );


                                                item.classList.remove(
                                                    "ratings_hover"
                                                );


                                                if (
                                                    itemRate <= data.rate
                                                ) {

                                                    item.classList.add(
                                                        "ratings_over"
                                                    );

                                                } else {

                                                    item.classList.remove(
                                                        "ratings_over"
                                                    );

                                                }

                                            }
                                        );

                                    }
                                )


                                .catch(
                                    function (error) {

                                        console.error(
                                            error
                                        );

                                        alert(
                                            "Something went wrong."
                                        );

                                    }
                                );

                        }
                    );

                }
            );

        }
    );

</script>
